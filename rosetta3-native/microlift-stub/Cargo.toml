[package]
name = "microlift"
version = "0.1.0"
edition = "2024"
description = "Stand-in for Microlift so rosetta3 builds without it: native execution only."

[features]
disasm = []
runtime = []

[dependencies]
cranelift-codegen = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental" }
cranelift-frontend = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental" }
cranelift-native = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental" }
function_traits = { git = "https://github.com/microlift/function_traits.git" }
target-lexicon = "0.13"
iced-x86 = "1"
