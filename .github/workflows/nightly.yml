name: Nightly

# Builds the default branch every night and publishes it as a pre-release,
# but only when it has commits that are not in a nightly release yet.
on:
  schedule:
    # 23:41 UTC every day. Off the hour, because GitHub delays scheduled runs
    # most at the start of each hour.
    - cron: "41 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the newest commit already has a nightly release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.name.outputs.version }}
      tag: ${{ steps.name.outputs.tag }}
      title: ${{ steps.name.outputs.title }}
      when: ${{ steps.name.outputs.when }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for commits without a nightly release
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          released=$(git tag --points-at "$sha" --list 'nightly-*')
          if [ -n "$released" ] && [ "$FORCE" != "true" ]; then
            echo "$sha is already in $released; nothing new to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The version is the one in nutmeg/__init__.py, or the one after the
      # newest release when that one is released already, followed by
      # .devYYYYMMDDHHMM (see scripts/release.py).
      - name: Name the build
        id: name
        if: steps.check.outputs.build == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          stamp=$(date -u +%Y%m%d%H%M)
          version=$(python3 scripts/release.py nightly-version --stamp "$stamp")
          {
            echo "version=$version"
            echo "tag=nightly-${stamp:0:8}-${stamp:8:4}"
            echo "title=Nightly ${stamp:0:4}-${stamp:4:2}-${stamp:6:2} (${SHA:0:7})"
            echo "when=${stamp:0:4}-${stamp:4:2}-${stamp:6:2} ${stamp:8:2}:${stamp:10:2} UTC"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.check.outputs.sha }}
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SHA: ${{ needs.check.outputs.sha }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ needs.check.outputs.title }}
          WHEN: ${{ needs.check.outputs.when }}
        run: |
          python3 scripts/release.py checksums dist
          python3 scripts/release.py notes --kind nightly --sha "$SHA" --tag "$TAG" \
            --version "$VERSION" --dir dist --branch "$BRANCH" --built "$WHEN" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* \
            --prerelease \
            --target "$SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"
